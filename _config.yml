title: The Gravity of Thought
description: A blog that lies in the intersection of philosophy and physics. Meant to do what art does : start conversations unusual enough to connect the viewers on a deeper-than-usual plane. I'll go first : "Logic and love work together more often than you'd think. Also, black holes don't exactly radiate particles, they just make anti-particles disappear. And oh.. There are many here among us Who feel that life is but a joke But you and I, we've been through that And this is not our fate.* The universe makes more sense, and less, than we expect." *All along the watchtower- Bob Dylan
